id: swift-float-money
language: swift
severity: warning
message: "Money held in a float: Double rounds (0.1 + 0.2 != 0.3). Use Decimal, or integer minor units (priceCents: Int)."
note: |
  Money in a binary float drifts: 0.1 + 0.2 != 0.3. A field, variable or
  parameter named like money (price, amount, cost, balance, fee, ...) typed
  Double or Float is reported (CGFloat is layout, not money); price: Decimal or priceCents: Int are not. Strict preset only.
rule:
  any:
    - kind: property_declaration
    - kind: parameter
  has:
    stopBy: end
    kind: type_identifier
    regex: "^(Double|Float|Float32|Float64)$"
  all:
    - has:
        stopBy: end
        kind: simple_identifier
        regex: "(^|_)(?i:price|amount|cost|balance|fee|subtotal|tax|payment|payout|refund|revenue|salary|wage|budget|deposit|withdrawal|pnl|profit|notional|premium)s?(_?(?i:usd|eur|gbp|usdc|usdt))?$|[a-z0-9](Price|Amount|Cost|Balance|Fee|Subtotal|Tax|Payment|Payout|Refund|Revenue|Salary|Wage|Budget|Deposit|Withdrawal|Profit|Notional|Premium|P[nN][lL])s?((?i:_?usd|eur|gbp|usdc|usdt))?$"
metadata:
  category: correctness
  autofix: none
  since: "0.2.5"
