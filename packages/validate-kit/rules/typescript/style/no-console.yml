---
id: mjs-no-console
language: javascript
files:
  - "**/*.mjs"
  - "**/*.cjs"
severity: warning
message: "Remove leftover console.$METHOD (console.error inside a catch, and CLI entry files, are allowed)."
note: |
  Debug logging should not ship. Use a structured logger for intentional output.
  CLI entry files (bin/, scripts/, a shebang on the first line, an entry-point check, a module
  that imports and exports nothing) print by design and are skipped.
rule:
  kind: expression_statement
  has:
    pattern: console.$METHOD($$$ARGS)
  not:
    any:
      - inside:
          kind: catch_clause
          stopBy: end
      # A file starting with a shebang is a program: its output is its product.
      - inside:
          kind: program
          has:
            kind: hash_bang_line
          stopBy: end
      # So is a file that asks whether it is the entry point.
      - inside:
          kind: program
          has:
            stopBy: end
            any:
              - pattern: import.meta.main
              - pattern: require.main
          stopBy: end
      # A Node module (.mjs, .cjs) that imports and exports nothing is run,
      # not imported (`node li-login.mjs`). A browser app's entry (.js, .jsx,
      # .ts, .tsx) is imported by its bundler, so js-no-console has no such
      # exemption.
      - inside:
          kind: program
          stopBy: end
          all:
            - has:
                stopBy: end
                any:
                  - kind: import_statement
                  - pattern: require($MODULE)
            - not:
                has:
                  kind: export_statement
            - not:
                has:
                  stopBy: end
                  any:
                    - pattern: module.exports
                    - pattern: exports.$NAME
constraints:
  METHOD:
    regex: "^(log|debug|info|trace|warn)$"
ignores:
  - "**/*.test.mjs"
  - "**/*.test.cjs"
  - "**/*.spec.mjs"
  - "**/bin/**"
  - "**/scripts/**"
metadata:
  category: style
  autofix: none
  since: "0.1.0"
