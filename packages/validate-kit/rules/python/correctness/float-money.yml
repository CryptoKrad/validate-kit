id: py-float-money
language: python
severity: warning
message: "Money held in a float: float rounds (0.1 + 0.2 != 0.3). Keep integer minor units (price_cents: int) or use decimal.Decimal."
note: |
  Money in a binary float drifts: 0.1 + 0.2 != 0.3. A name like money
  annotated float is reported; price_cents: int or Decimal are not.
  Strict preset only.
rule:
  any:
    - kind: assignment
      has:
        field: left
        regex: "(^|_)(?i:price|amount|cost|balance|fee|subtotal|tax|payment|payout|refund|revenue|salary|wage|budget|deposit|withdrawal|pnl|profit|notional|premium)s?(_?(?i:usd|eur|gbp|usdc|usdt))?$|[a-z0-9](Price|Amount|Cost|Balance|Fee|Subtotal|Tax|Payment|Payout|Refund|Revenue|Salary|Wage|Budget|Deposit|Withdrawal|Profit|Notional|Premium|P[nN][lL])s?((?i:_?usd|eur|gbp|usdc|usdt))?$"
    - kind: typed_parameter
      has:
        kind: identifier
        regex: "(^|_)(?i:price|amount|cost|balance|fee|subtotal|tax|payment|payout|refund|revenue|salary|wage|budget|deposit|withdrawal|pnl|profit|notional|premium)s?(_?(?i:usd|eur|gbp|usdc|usdt))?$|[a-z0-9](Price|Amount|Cost|Balance|Fee|Subtotal|Tax|Payment|Payout|Refund|Revenue|Salary|Wage|Budget|Deposit|Withdrawal|Profit|Notional|Premium|P[nN][lL])s?((?i:_?usd|eur|gbp|usdc|usdt))?$"
    - kind: typed_default_parameter
      has:
        field: name
        regex: "(^|_)(?i:price|amount|cost|balance|fee|subtotal|tax|payment|payout|refund|revenue|salary|wage|budget|deposit|withdrawal|pnl|profit|notional|premium)s?(_?(?i:usd|eur|gbp|usdc|usdt))?$|[a-z0-9](Price|Amount|Cost|Balance|Fee|Subtotal|Tax|Payment|Payout|Refund|Revenue|Salary|Wage|Budget|Deposit|Withdrawal|Profit|Notional|Premium|P[nN][lL])s?((?i:_?usd|eur|gbp|usdc|usdt))?$"
  has:
    field: type
    regex: "^(float(\\s*\\|\\s*None)?|Optional\\[float\\]|list\\[float\\])$"
metadata:
  category: correctness
  autofix: none
  since: "0.2.5"
