id: rust-no-panic-macros
language: rust
severity: warning
message: "Avoid panic!/todo!/unimplemented!/unreachable! in shipped code — return a Result error."
note: |
  These abort the process. unreachable! is only acceptable with a proof comment.
rule:
  kind: macro_invocation
  has:
    field: macro
    regex: "^(panic|todo|unimplemented|unreachable)$"
  # Test code is exempt: panicking in a `#[cfg(test)]` mod or `#[test]` fn is
  # idiomatic. `follows` walks back only through this item's own stacked
  # attributes and comments (see rust-no-unwrap).
  not:
    any:
      - inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: "cfg\\(test\\)"
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
      - inside:
          kind: function_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: "^#\\[\\s*(\\w+::)*(test|rstest|test_case)\\b"
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
metadata:
  category: correctness
  # A file its parent declares as `#[cfg(test)] mod x;` is test code too;
  # the kit drops matches there, which a rule reading one file cannot.
  cfgTestFiles: exempt
  autofix: none
  since: "0.1.0"
