id: rust-no-unwrap
language: rust
severity: warning
message: "Avoid .unwrap()/.expect() in library code — propagate with ? or handle the error."
note: |
  .unwrap()/.expect() panic on None/Err. Prefer ?, match, or .context(...).
  Acceptable in tests, examples and prototypes.
rule:
  any:
    - pattern: $RECV.unwrap()
    - pattern: $RECV.expect($MSG)
  # Test code is exempt (matches the note): matches inside a `#[cfg(test)]`
  # mod or a `#[test]`/`#[tokio::test]`/`#[rstest]`/`#[test_case]` fn are
  # idiomatic. `follows` walks back only through the attributes and comments
  # stacked on this item (`#[tokio::test] #[ignore] /// doc fn`), so an
  # attribute of an earlier item never exempts it.
  not:
    any:
      - inside:
          kind: mod_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: "cfg\\(test\\)"
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
      - inside:
          kind: function_item
          stopBy: end
          follows:
            kind: attribute_item
            regex: "\\b(test|rstest|test_case)\\b"
            stopBy:
              not:
                any:
                  - kind: attribute_item
                  - kind: line_comment
                  - kind: block_comment
ignores:
  - "**/tests/**"
  - "**/benches/**"
  - "**/examples/**"
metadata:
  category: correctness
  # No `fix:` key exists — declaring "suggestion" would misrepresent the rule
  # as fixable in docs/listings (a real ?-propagation fix needs Result-return
  # context ast-grep can't see).
  autofix: none
  since: "0.1.0"
