id: rust-no-unwrap
snapshots:
  ? |-
    #[test]
    fn t() {}

    #[inline]
    fn f() { x.unwrap(); }
  : labels:
    - source: x.unwrap()
      style: primary
      start: 38
      end: 48
  fn f() { let x = g().expect("must exist"); }:
    labels:
    - source: g().expect("must exist")
      style: primary
      start: 17
      end: 41
  fn f() { let x = g().unwrap(); }:
    labels:
    - source: g().unwrap()
      style: primary
      start: 17
      end: 29
