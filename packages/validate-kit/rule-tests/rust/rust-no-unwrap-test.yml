id: rust-no-unwrap
valid:
  - "fn f() -> Result<(), E> { let x = g()?; Ok(()) }"
  - "fn f() { match g() { Ok(v) => v, Err(_) => return } }"
  - "#[cfg(test)]\nmod tests {\n    #[test]\n    fn t() { let x = g().unwrap(); }\n}"
  - "#[test]\nfn t() { let x = g().expect(\"seed\"); }"
  - "#[tokio::test]\n#[ignore = \"reason\"]\nasync fn t() { x.unwrap(); }"
  - "#[tokio::test]\n/// doc\nasync fn t() { x.unwrap(); }"
  - "#[rstest]\nfn t() { x.unwrap(); }"
  - "#[cfg(test)]\n#[allow(dead_code)]\nmod tests {\n    fn h() { x.unwrap(); }\n}"
invalid:
  - "fn f() { let x = g().unwrap(); }"
  - "fn f() { let x = g().expect(\"must exist\"); }"
  - "#[test]\nfn t() {}\n\n#[inline]\nfn f() { x.unwrap(); }"
