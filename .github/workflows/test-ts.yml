name: test-ts

# Layers 4-8: unit · component · API mocking · integration · API tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-component-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api — unit + API (Supertest)
        run: pnpm --fail-if-no-match --filter api run test
      - name: web — unit + component + MSW
        run: pnpm --fail-if-no-match --filter web run test
      # The provider must verify what the consumer expects now: regenerate the
      # pact from nothing, verify it, and fail if it differs from the
      # committed one (scripts/check-pact.mjs).
      - name: Pact freshness (consumer -> provider -> committed file)
        run: pnpm run pact:check

  integration:
    # Testcontainers-based integration. Docker is available on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api — integration (Testcontainers Postgres)
        run: pnpm --fail-if-no-match --filter api run test:integration:docker
