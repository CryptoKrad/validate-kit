name: e2e

# Layers 10-11: Playwright E2E + visual regression. HARD gate on PRs and main
# (the soft-pass policy forbids continue-on-error outside perf, so informational-
# on-PR is intentionally not implemented).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Render inside the SAME pinned Playwright container the visual baseline was
    # generated in (apps/web/e2e/visual.spec.ts-snapshots/login.png), so font/AA
    # rendering matches byte-for-byte. Must track @playwright/test in apps/web.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --fail-if-no-match --filter web exec playwright install --with-deps chromium
      - name: E2E + visual
        run: pnpm --fail-if-no-match --filter web run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: error
          retention-days: 7
