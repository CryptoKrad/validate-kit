name: poly

# Proves the framework drives every polyglot linter on real code: installs the
# Rust/Go/Python toolchains + ast-grep and runs the polyglot behavioral test
# (clippy, golangci-lint, ruff, rustfmt, gofumpt must run clean; custom rules fire).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: poly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  polyglot-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-03-27
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Install Go tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install mvdan.cc/gofumpt@v0.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install ruff + ast-grep
        # zizmor: ignore[adhoc-packages] an exact version, as the lockfile would pin it
        run: |
          uv tool install ruff==0.17.4
          uv tool update-shell || true # soft-pass-ok: shell-profile convenience only; PATH is set explicitly on the next line
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g @ast-grep/cli@0.51.1
      - name: Build validate-kit
        run: cd packages/validate-kit && ./node_modules/.bin/tsup
      - name: Polyglot behavioral test (clippy/golangci/ruff/fmt + custom rules)
        run: pnpm --fail-if-no-match --filter validate-kit run test:polyglot
