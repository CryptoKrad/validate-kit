name: validate

# The `check` gate: format · lint (oxlint) · type-check · custom ast-grep rules,
# plus the kit's own behavioral test suite and the rule snapshot tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: pnpm install --frozen-lockfile
      - name: Build validate-kit
        run: cd packages/validate-kit && ./node_modules/.bin/tsup
      # The smoke runs the tlc adapter against real TLC; the jar is the
      # release whose output was recorded (docs/research/formal-adapters).
      - name: Install TLC (TLA+ tools 1.7.4, checksum-pinned)
        run: |
          JAR="$HOME/.local/share/tlaplus/tla2tools.jar"
          mkdir -p "$(dirname "$JAR")" "$HOME/.local/bin"
          curl -fsSL -o "$JAR" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $JAR" | sha256sum -c -
          printf '#!/bin/sh\nexec java -XX:+UseParallelGC -cp "%s" tlc2.TLC "$@"\n' "$JAR" > "$HOME/.local/bin/tlc"
          chmod +x "$HOME/.local/bin/tlc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The smoke runs the lean adapter against real Lean: elan is the pinned
      # release (checksum from GitHub), and installs the toolchain whose output
      # was recorded (docs/research/formal-adapters/ci-install.md).
      - name: Install Lean (elan 4.2.4 checksum-pinned, Lean 4.34.1)
        run: |
          ELAN="$RUNNER_TEMP/elan.tar.gz"
          curl -fsSL -o "$ELAN" https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $ELAN" | sha256sum -c -
          tar -xzf "$ELAN" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The smoke runs the quint adapter against real Quint, the release whose
      # output was recorded (docs/research/formal-adapters/quint-cli.md); npm
      # checks the package against the integrity hash the registry publishes.
      - name: Install Quint 0.32.0
        # zizmor: ignore[adhoc-packages] an exact version, as the lockfile would pin it
        run: npm install --global @informalsystems/quint@0.33.1
      # `check --profile ci` is strict: semgrep is a planned tool, so it must
      # be installed before doctor and check, or both report incomplete
      # coverage (exit 3).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install semgrep (pinned, same as security.yml and mise.toml)
        env:
          SEMGREP_VERSION: "1.184.0"
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"
      # The gate also runs zizmor (.github/zizmor.yml) and typos (_typos.toml),
      # the versions this machine runs.
      - name: Install zizmor and typos (pinned)
        # zizmor: ignore[adhoc-packages] an exact version, as the lockfile would pin it
        run: python -m pip install "zizmor==1.32.0" "typos==1.52.0"
      - name: Install check-jsonschema (pinned; renovate.json is here)
        run: python -m pip install "check-jsonschema==0.39.0"
      - name: Install shfmt (pinned; validate.config.ts enables it for this repo)
        run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
      # validate.config.ts enables agnix here. The release binary, checksum-pinned
      # (the digest is the one published beside the asset, recomputed on download
      # on 2026-11-04); ~/.local/bin is on PATH from the TLC step.
      - name: Install agnix 0.61.0 (checksum-pinned)
        run: |
          curl -fsSL -o /tmp/agnix.tar.gz https://github.com/agent-sh/agnix/releases/download/v0.61.0/agnix-x86_64-unknown-linux-gnu.tar.gz
          echo "cfc8f4c5a51d023bbc8742fb84f420b12d3d49b621c8ccfb7382c5f73944ad09  /tmp/agnix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agnix.tar.gz -C "$HOME/.local/bin" agnix
          chmod +x "$HOME/.local/bin/agnix"
      - name: Doctor (every tool the strict gate plans is installed)
        run: pnpm exec check doctor --profile ci
      - name: ast-grep rule snapshot tests
        run: cd packages/validate-kit && ./node_modules/.bin/ast-grep test
      - name: validate-kit core behavioral tests
        run: pnpm --fail-if-no-match --filter validate-kit run test:core
      - name: External package tarball smoke
        env:
          # A formal case that would be skipped locally is a failure here.
          SMOKE_REQUIRE_FORMAL: "1"
        run: pnpm run smoke:external-package
      - name: Validate workflow definitions
        run: pnpm run workflow:check
      - name: Validate application and package code (hard gate)
        run: pnpm run check
      - name: API contract — OpenAPI spec current + breaking-change gate (oasdiff)
        env:
          # The event's base: on a push, origin/main is this commit itself.
          OPENAPI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.37.0
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          git fetch --no-tags --depth=1 origin main || true # soft-pass-ok: tolerate missing origin/main on forks/first push; openapi:check still gates the spec (fetch-flake hardening tracked as S-M2)
          pnpm run openapi:check

  # R18 (docs/architecture/engine-generalisation.md): on Windows the engine
  # finds the system git through PATHEXT and never runs a git the project puts
  # in its own folder. The core tests run here too.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build validate-kit
        run: pnpm run build
      - name: Windows smoke (system git lookup)
        run: node scripts/smoke-windows.mjs
      - name: validate-kit core behavioral tests
        run: pnpm --fail-if-no-match --filter validate-kit run test:core
      # Windows-only paths: Lake's backslash paths, and a native tool run as
      # itself, not through sh. One step each: a `|` in a -t pattern reaches
      # cmd.exe (it runs the vitest.cmd shim), which reads it as a pipe.
      - name: validate-kit Lean Windows paths
        run: pnpm --fail-if-no-match --filter validate-kit exec vitest run test/lean.test.ts
      - name: validate-kit batchThenEach on Windows
        run: pnpm --fail-if-no-match --filter validate-kit exec vitest run test/swift-dart-lua-haskell-nix.test.ts -t batchThenEach
